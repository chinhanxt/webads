name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        # NEXT_PUBLIC_* values are inlined into the bundle at build time. Because
        # this workflow uploads a prebuilt `out/`, Cloudflare never runs a build —
        # so these must live in GitHub, and env vars set in the Cloudflare Pages
        # dashboard have no effect on this site.
        env:
          NEXT_PUBLIC_SITE_DOMAIN: ${{ vars.NEXT_PUBLIC_SITE_DOMAIN }}
          NEXT_PUBLIC_ADS_ENABLED: ${{ vars.NEXT_PUBLIC_ADS_ENABLED }}
          NEXT_PUBLIC_ADSTERRA_728: ${{ vars.NEXT_PUBLIC_ADSTERRA_728 }}
          NEXT_PUBLIC_ADSTERRA_300: ${{ vars.NEXT_PUBLIC_ADSTERRA_300 }}
          NEXT_PUBLIC_ADSTERRA_320: ${{ vars.NEXT_PUBLIC_ADSTERRA_320 }}
          NEXT_PUBLIC_ADSTERRA_NATIVE_SRC: ${{ vars.NEXT_PUBLIC_ADSTERRA_NATIVE_SRC }}
          NEXT_PUBLIC_ADSTERRA_NATIVE_ID: ${{ vars.NEXT_PUBLIC_ADSTERRA_NATIVE_ID }}
          NEXT_PUBLIC_ADSTERRA_SOCIALBAR_SRC: ${{ vars.NEXT_PUBLIC_ADSTERRA_SOCIALBAR_SRC }}
          NEXT_PUBLIC_ADSTERRA_POPUNDER_SRC: ${{ vars.NEXT_PUBLIC_ADSTERRA_POPUNDER_SRC }}
          NEXT_PUBLIC_AFFILIATE_URL: ${{ vars.NEXT_PUBLIC_AFFILIATE_URL }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - name: Verify export
        # ~4,800 pages. A build that silently produces a handful of files should
        # never reach the CDN, and Cloudflare Pages caps a deployment at 20,000
        # files, so check both ends before uploading.
        run: |
          pages=$(find out -name '*.html' | wc -l)
          files=$(find out -type f | wc -l)
          echo "html pages: $pages"
          echo "total files: $files"
          test "$pages" -gt 4000 || { echo "::error::only $pages pages exported"; exit 1; }
          test "$files" -lt 20000 || { echo "::error::$files files exceeds the Pages limit"; exit 1; }
          test -s out/sitemap.xml || { echo "::error::sitemap.xml missing or empty"; exit 1; }

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=autoquotehub --branch=main
